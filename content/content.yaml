  - name: Teaching
    title: Teaching Effectiveness
    subtitle: Demonstrated teaching excellence, near-perfect student opinion ratings, innovative classroom pedagogy.
    content: 
      - type: photos
        content:
          - content/images/me with 5 students in lab.JPG
