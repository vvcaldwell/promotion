          - content/images/me teaching.JPG
      - type: highlights
        content: 
          - title: 4.9 / 5.0
            subtitle: Average Student Opinion Rating (SOR) Across All Courses
          - title: 5x
            subtitle: Excellence in Teaching Award Nominee (2022-2026)
          - title: 13
            subtitle: Distinct CS Courses Taught (100-400 Level)
          - title: 9
            subtitle: Semesters with Voluntary Overload
      - type: markdown
        content: |
          I have two primary goals in teaching. The first is to inspire a passion
          and enthusiasm for Computer Science (CS), technology, and problem-solving
          among my students. The second is to expose students to key foundational
          concepts in CS and build a solid grounding for my students to become
          life-long learners. In addition to the goals above, I have several
          secondary goals as an instructor:

            - to let my students know that they matter, that I like them, and that
              I am there for them
            - to provide equitable opportunities for my students according to each
              student's individual needs, capabilities, and drive
            - to emphasize resume-building, interview preparation, and general
              career-readiness
            - to emphasize speaking and presentation skills in courses that allow
              for this
            - to turn my students into well-rounded professionals and human beings

          I refer to the bulleted goals above as "secondary" not because these are
          less important than my primary goals, but rather because they are founded
          in and naturally stem from my two primary teaching objectives.

          I have demonstrated a high level of effectiveness in teaching and
          developing a wide variety of courses that span the entire Computer Science
          curriculum, from foundational 100-level introductory classes to advanced
          400-level senior requirements. My teaching portfolio includes core
          sequences such as Computer Programming I and II, as well as specialized
          upper-level courses like Artificial Intelligence, UI/UX Human-Centered
          Design, and the Software Engineering Capstone. I have also been deeply
          involved in the First-Year Student Seminar, helping incoming students
          transition to university life. Beyond mere instruction, I led the major
          effort to modernize the curriculum by transitioning our core programming
          sequence from Java to Python to better prepare students for modern
          industry expectations. I have also developed several new courses and
          authored master courses on Blackboard for foundational classes to ensure
          instructional consistency and rigor across all sections.

          My pedagogical approach is centered on using current and relevant
          technology, and I frequently develop my own software solutions when
          existing options do not meet the specific needs of my students. I have
          integrated Jupyter Notebooks into my teaching, which allows me to present
          and run live computer code directly within my lecture notes, a technique
          that significantly enhances procedural learning. To improve classroom
          management and academic integrity, I designed and developed several
          applications, including LectureSeats for multi-factor attendance tracking
          and LectureTest for secure, proctored coding examinations (this developed
          technology is also used now by other Caldwell instructors in departments
          such as Business and Psychology). By using tools like Figma for design
          and VS Code for development, I ensure that my students are working with
          the same professional environments they will encounter in their careers.

          I have been highly effective in adapting and updating my course structures
          and grading schemas to meet evolving challenges, particularly in response
          to the rise of generative AI. Recognizing that standard assignments can
          now be easily automated, I rebalanced my grading structure so that
          high-stakes, proctored in-class assessments make up the vast majority of
          the final grade. I now use take-home assignments primarily as low-stakes
          preparation for these proctored tests rather than as the primary evidence
          of learning. This shift ensures that I can accurately gauge a student's
          true code-writing abilities. Furthermore, I have introduced "sprint-based"
          project management in courses like Programming II, requiring frequent code
          commits via Git and GitHub so that I can inspect the progress of student
          work over time rather than just the final product.

          The effectiveness of my teaching is consistently validated by my peer
          observers, who highlight my ability to maintain high engagement even in
          large lecture settings. During a review of my Computer Programming II
          course, Dr. Ruth DeBar noted that my "animation and rapport with the
          students made the large lecture hall feel like a small and intimate class"
          and that my "passion for the topic and for student success was clear."
          She also observed my innovative use of technology for attendance and my
          commitment to confirming student understanding before moving to new
          concepts. Similarly, Dr. Kenneth Reeve praised my ability to "present and
          run computer code directly in [my] lecture notes" and commended my
          proactive efforts to address academic integrity in the age of AI,
          describing me as a "wonderful asset to the University, [my] students, and
          [my] discipline."
      - type: markdown
        title: Student Opinion Reports
        content: My teaching success is further evidenced by exceptional student engagement and near-perfect Student Opinion Report (SOR) ratings, which average **4.9 out of 5.0** across all courses. Additionally, students frequently go beyond the syllabus requirements to ask complex questions, reflecting a deep interest in the material. My commitment to student success is a common theme in their feedback, as seen in the representative student comments below.
