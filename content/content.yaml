          where faculty, administration, and staff can more easily pursue their
          teaching, scholarship, and service goals. This commitment is evidenced
          by my focus on interdisciplinary partnerships — such as co-founding our
          research centers — and my ongoing efforts to provide infrastructure and
          project support. By mentoring new faculty, sharing technical expertise,
          and collaborating closely with support staff to improve our shared
          resources, I aim to strengthen the university's mission, cultivate a
          positive community, and foster productive relationships that ultimately
          benefit our students and the broader university culture.

