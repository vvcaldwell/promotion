  - name: Scholarship
    title: Scholarship
    subtitle: Peer-reviewed publications, interdisciplinary lab leadership, grant acquisition, open-source software, and curriculum design.
    content: 
      - type: photos
        content:
          - content/images/me-presenting-3.jpg
          - content/images/me-presenting-1.jpg
          - content/images/me-presenting-4.jpg
          - content/images/me-presenting-2.jpg
      - type: highlights
        content:
          - title: 18
            subtitle: Peer-Reviewed Publications & Presentations since Jan 2022
          - title: 10
            subtitle: Courses Developed at Caldwell
          - title: 22
            subtitle: Grant Proposals Submitted
          - title: 5
            subtitle: Software Projects Released
      - type: badges
        content:
          - "Alvin R. Calman Endowed Chair"
          - "CogAI Research Lab Founder & Director"
          - "C-STEM Labs Cofounder & Co-director"
      - type: markdown
        content: |
          Scholarship, to me, extends well beyond the traditional metrics of
          publications and conference presentations. While these remain important,
          I believe the highest purpose of scholarship at a teaching-focused
          institution is to create opportunities for students to grow intellectually,
          professionally, and personally. My scholarly activities are therefore
          guided by two primary goals. First, I strive to advance Computer Science
          through research, software development, and curriculum innovation that
          addresses meaningful problems in both the discipline and computer science
          education. Second, I seek to involve students as active collaborators
          throughout that process, helping them identify and develop research
          questions that reflect their own interests, passions, and career
          aspirations and providing the mentorship necessary to transform those
          ideas into rigorous scholarly work.

          This philosophy has shaped nearly every aspect of my scholarly activity
          at Caldwell. It influences the curriculum I design, the research projects
          I pursue, the software I develop, and the structure of the laboratories
          I lead. Rather than asking students to contribute to a single research
          agenda, I encourage them to develop projects that reflect their own
          interests and career aspirations. As a result, students in my laboratory
          have investigated topics ranging from financial technology and machine
          learning to human-computer interaction, educational technology, health
          care applications, software engineering, accessibility, and AI-assisted
          systems. My role is to help students refine these ideas into technically
          rigorous projects while teaching the research, communication, and
          engineering skills necessary to bring them to completion.

          I also view curriculum development as an important form of scholarship.
          Computer Science is among the fastest-evolving academic disciplines, and
          our responsibility as educators extends beyond teaching existing material
          — we must continually evaluate how the discipline is changing and redesign
          curricula to ensure that students graduate with knowledge and skills that
          remain relevant. This perspective has guided my efforts to modernize the
          Computer Science curriculum, develop new interdisciplinary programs,
          increase flexibility through elective pathways, and introduce emerging
          topics such as artificial intelligence, full-stack web development, and
          human-computer interaction. My goal has never been simply to add new
          courses, but to create a curriculum that allows students with diverse
          interests to pursue meaningful and individualized educational paths.

          My own research has likewise evolved in response to the educational
          challenges I encounter in the classroom. While my earlier work focused
          primarily on cognitive modeling, artificial intelligence, and human-computer
          interaction, many of my recent projects investigate questions arising
          directly from teaching Computer Science. These include developing more
          effective approaches to academic integrity, designing software that
          improves student learning and assessment, exploring technologies that make
          programming instruction more accessible, and studying how AI can be
          integrated responsibly into Computer Science education. I find this
          intersection of research and teaching particularly rewarding because
          improvements resulting from these projects immediately benefit my own
          students while contributing knowledge that helps educators and students
          beyond Caldwell.

          Since joining the Caldwell University faculty in January 2022, I have
          maintained an active and productive research agenda that aligns with the
          above-stated philosophy and the University's expectation for faculty
          engagement with emerging trends in Computer Science. 
          My scholarship is multifaceted, encompassing curriculum development, original research in
          Artificial Intelligence and Human-Computer Interaction, the development
          of innovative educational and research software, significant grant
          acquisition efforts, and consistent publication and presentation of my
          work at professional conferences. This commitment to scholarship not only
          facilitates my own professional growth but also directly enhances the
          academic environment for my students, providing them with opportunities
          to participate in cutting-edge research and work with modern technological tools.

          My scholarship and rigorous research program were recognized by the
          University, culminating in the prestigious award and my appointment
          as the **Alvin R. Calman Endowed Chair** in May 2025.
      - type: markdown
        title: Curriculum Development
        content: |
          - Major contributor on a proposal for MS in Computer Science graduate program at Caldwell University
          - Contributed to developing a new STEM MBA graduate program at Caldwell University
          - Redesigned Computer Science major
            - Updated the major to modernize it and tailor it to Caldwell student population, adding more flexibility in concentration, adding emphasis on modern software development (especially full-stack web development), and removing legacy requirements (e.g., Calculus)
          - Redesigned Computer Programming I and II, Front-End and Full-stack development courses
            - Modernized introductory programming courses around Python as an industry standard development language, widely considered to be the best language for new programmers
            - Modernized Front-End and Full-stack development courses to reflect modern web architecture (e.g., Express, REST, JSON, NoSQL)
          - Developed new multidisciplinary minor – Human-Computer Interaction
            - An interdisciplinary curriculum that bridges computer science and psychology, equipping students with user-centric design skills essential for modern UX/UI career paths.
          - Developed new undergraduate courses – 
            - CS 150 AI Essentials
              - Focuses on AI fluency and a "human-in-the-loop" philosophy, training students to audit AI outputs and integrate automation ethically, ensuring they are prepared for an AI-driven workforce.
            - CS 242 UI/UX Human-centered design
              - Emphasizes industry-standard tools like Figma and user-centric evaluation methodologies, directly mirroring professional design processes to enhance career readiness.
            - CS 415 Computational Models and Simulations
              - Provides critical exposure to real-world behavioral modeling and data science techniques, preparing students for high-demand roles in analytics and AI strategy.
            - CS 197 Computer Programming Accelerated
              - Designed to accelerate technical proficiency, facilitating a faster, more effective transition to advanced coursework and internships by streamlining introductory programming sequences.
            - CS 491/492 Research in Computer Science I/II
              - Fosters professional development through original research, peer-reviewed publication, and conference presentation, positioning students as highly competitive candidates for graduate programs and research-intensive careers.
          - Developed new graduate courses – 
            - Machine Learning, AI Engineering and Generative Systems, Programming for Business, Leveraging Artificial Intelligence for Competitive Advantage, Computational Models & Simulations
            - Courses were developed as a part of new STEM MBA and MS in Computer Science program proposals.
