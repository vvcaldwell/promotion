      - type: markdown
        content: |
          Since joining the Caldwell University faculty in January 2022, I have
          served as a dedicated academic advisor to a large volume of Computer
          Science, CIS, and Marketing students, typically maintaining a roster of
          40-50+ advisees annually. My approach to advising and mentorship is
          holistic, extending beyond course scheduling and degree progression to
          include career readiness, internship placement, and professional
          development. I actively guide students in navigating complex graduation
          constraints while ensuring they are prepared for the demands of the
          modern technology industry.

          A significant component of my mentorship involves supporting students in
          their long-term aspirations. As part of this commitment I have served as
          a First-Year Seminar instructor, and I regularly serve as an advisor for
          student internships. A not-insignificant portion of my time is dedicated
          to writing recommendation letters; since joining Caldwell, I have written
          and submitted approximately 150-200 letters to support students applying
          for scholarships, summer research programs, fellowships, graduate schools,
          and career opportunities. This commitment ensures that my students remain
          competitive candidates for top-tier programs and positions.

          My research mentorship is a cornerstone of my interactions with students.
          I strongly believe that student research participation is a transformative
          catalyst that gives students a distinct advantage over those who do not
          engage in such work or attend college, serving as a unique pathway for
          their growth as individuals, professionals, and thinkers, and acting as
          one of the best foundations for successful graduate studies. As the
          founder and director of the CogAI Research Laboratory and co-founder of
          the C-STEM Laboratories, I have mentored dozens of undergraduate researchers
          annually—ranging from 5-10 students during the semester to up to 18 during
          the summer. I guide these students through every phase of the research
          process, from writing competitive proposals (with dozens of STEM Advance
          Summer Research proposals accepted under my guidance) to the development
          of complex projects, resulting in numerous peer-reviewed publications and
          presentations at the annual Caldwell Research Day. Additionally, I have
          served as an advisor on four Honors Thesis Projects (Anuj Khadka, Dibas
          Dauliya, Subham Chaudhary, Saurav Ghimire).

          Furthermore, I am deeply involved in student life as the advisor for
          multiple organizations, including the Caldwell Computer Science Club, the
          Caldwell Robotics Club, and the Google Developers Group. I actively mentor
          these student leaders in organizing large-scale events, securing funding,
          and coordinating successful participation in intercollegiate competitions.
          By fostering these extracurricular opportunities and maintaining an
          open-door policy, I aim to create a supportive environment that prepares
          students to become well-rounded, career-ready professionals.
