      - type: markdown
        content: |
          I view service not simply as participation in university governance, but
          as an opportunity to build the infrastructure, programs, and collaborative
          relationships that enable students and faculty to succeed long after any
          individual initiative has concluded. Whether serving on committees,
          mentoring colleagues, developing new academic programs, or establishing
          research and teaching resources, I strive to create systems that
          strengthen the university and continue providing value for years to come.

          Since joining Caldwell University, I have been deeply committed to the
          effective functioning of the institution through active participation in
          shared governance and ongoing institutional service. My involvement spans
          high-level leadership, such as co-directing the Faculty Development
          Committee and the Teaching & Learning Center, to vital contributions on
          the Institutional Review Board and various faculty search committees.
          Beyond internal governance, I am dedicated to advancing the university's
          mission through community outreach, the leadership of student organizations,
          and the modernization of our departmental infrastructure. I view service
          as a key mechanism for fostering an environment where both students and
          faculty can thrive, and I take pride in contributing to the operational
          and academic excellence of the institution.
